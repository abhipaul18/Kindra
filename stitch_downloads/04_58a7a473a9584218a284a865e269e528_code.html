<style>
        .cycle-text {
            animation: cycleText 9s infinite;
        }
        @keyframes cycleText {
            0%, 20% { content: "Checking photo authenticity..."; opacity: 1; transform: translateY(0); }
            25%, 33% { opacity: 0; transform: translateY(-10px); }
            33.1%, 53% { content: "Verifying location..."; opacity: 1; transform: translateY(0); }
            58%, 66% { opacity: 0; transform: translateY(-10px); }
            66.1%, 86% { content: "Detecting duplicates..."; opacity: 1; transform: translateY(0); }
            91%, 100% { opacity: 0; transform: translateY(-10px); }
        }
        .cycle-text::after {
            content: "Checking photo authenticity...";
            animation: cycleText 9s infinite;
        }

        .spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col relative overflow-hidden">
<!-- Top Navigation (Dimmed) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-gutter h-16 bg-surface-container-lowest shadow-sm opacity-50 pointer-events-none">
<div class="flex items-center gap-gutter">
<span class="text-headline-md font-headline-md text-primary tracking-tight">Kindra</span>
<nav class="hidden md:flex gap-gutter h-full">
<a class="h-full flex items-center text-on-surface-variant font-label-md text-label-md" href="#">Citizen</a>
<a class="h-full flex items-center text-on-surface-variant font-label-md text-label-md" href="#">Officer</a>
<a class="h-full flex items-center text-on-surface-variant font-label-md text-label-md" href="#">Partner</a>
<a class="h-full flex items-center text-on-surface-variant font-label-md text-label-md" href="#">Admin</a>
</nav>
</div>
<div class="flex items-center gap-stack-md text-on-surface-variant">
<span class="material-symbols-outlined">notifications</span>
<span class="material-symbols-outlined">account_circle</span>
</div>
</header>
<!-- Dimmed Background Representation -->
<div class="absolute inset-0 z-0 bg-background opacity-80" style="background-image: radial-gradient(circle at center, transparent, rgba(25, 28, 30, 0.05));">
<!-- Mock dashboard elements -->
<div class="max-w-container-max mx-auto mt-32 grid grid-cols-12 gap-gutter px-gutter opacity-30 pointer-events-none blur-[2px]">
<div class="col-span-12 md:col-span-4 bg-surface-card rounded-xl h-64 shadow-sm border border-outline-variant/30"></div>
<div class="col-span-12 md:col-span-8 bg-surface-card rounded-xl h-64 shadow-sm border border-outline-variant/30"></div>
<div class="col-span-12 md:col-span-12 bg-surface-card rounded-xl h-96 shadow-sm border border-outline-variant/30"></div>
</div>
</div>
<!-- Processing Overlay Backdrop -->
<div class="absolute inset-0 z-40 bg-on-background/20 backdrop-blur-sm flex items-center justify-center p-gutter">
<!-- Main Processing Card -->
<div class="bg-surface-card rounded-xl shadow-lg w-full max-w-md p-section-gap flex flex-col items-center text-center relative overflow-hidden border border-outline-variant/20">
<!-- Soft Gradient Background Effect within Card -->
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed/30 to-secondary-fixed/20 opacity-50 z-0 rounded-xl pointer-events-none"></div>
<!-- Content Area -->
<div class="relative z-10 flex flex-col items-center w-full">
<!-- Animation Container -->
<div class="relative w-32 h-32 mb-stack-lg flex items-center justify-center">
<!-- Progress Spinner Track -->
<svg class="absolute w-full h-full text-surface-container-high" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="6"></circle>
</svg>
<!-- Progress Spinner Fill -->
<svg class="absolute w-full h-full text-primary spin-slow" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="url(#gradient)" stroke-dasharray="141 141" stroke-dashoffset="0" stroke-linecap="round" stroke-width="6"></circle>
<defs>
<lineargradient id="gradient" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#004287"></stop>
<stop offset="100%" stop-color="#006c48"></stop>
</lineargradient>
</defs>
</svg>
<!-- Center Animation -->
<div class="absolute inset-0 flex items-center justify-center p-4">

</div>
</div>
<!-- Text Content -->
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-stack-sm">
                    Gemma AI is verifying your submission...
                </h2>
<!-- Cycling Subtext -->
<div class="h-6 flex items-center justify-center overflow-hidden">
<p class="font-body-md text-body-md text-on-surface-variant cycle-text h-full"></p>
</div>
</div>
</div>
</div>
</body></html>
